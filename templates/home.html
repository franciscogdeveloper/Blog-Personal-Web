{% extends "base.html" %}

{% block content %}
  <h1>Blog personal</h1>

  {% if articles %}
    <ul class="article-list">
      {% for article in articles %}
        <li>
          <a href="{{ url_for('article', article_id=article.id) }}">{{ article.title }}</a>
          <span class="date">{{ article.date | long_date }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Todavía no hay artículos publicados.</p>
  {% endif %}
{% endblock %}
