{% extends "base.html" %}

{% block title %}Panel · Blog personal{% endblock %}

{% block content %}
  <h1>Panel de administración</h1>
  <p>Hay {{ articles | length }} artículos publicados.</p>

  <form method="post" action="{{ url_for('logout') }}" class="logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="link">Cerrar sesión</button>
  </form>
{% endblock %}
