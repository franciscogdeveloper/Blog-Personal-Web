{% extends "base.html" %}

{% block title %}{{ heading }} · Blog personal{% endblock %}

{% block content %}
  <h1>{{ heading }}</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="title">Título del artículo</label>
    <input id="title" name="title" value="{{ values.title }}" maxlength="200" required>

    <label for="date">Fecha de publicación</label>
    <input id="date" name="date" type="date" value="{{ values.date }}" required>

    <label for="content">Contenido</label>
    <textarea id="content" name="content" rows="12" required>{{ values.content }}</textarea>

    <button class="button" type="submit">Guardar</button>
    <a class="cancel" href="{{ url_for('admin') }}">Cancelar</a>
  </form>
{% endblock %}
